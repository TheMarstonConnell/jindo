name: Slither

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # so SARIF upload to the Code Scanning tab works

concurrency:
  group: slither-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run Slither
        uses: crytic/slither-action@v0.4.0
        id: slither
        with:
          target: contract/
          slither-config: contract/slither.config.json
          # Fail the build on a new high-severity finding. The existing 4
          # informational findings (assembly, cyclomatic-complexity) won't
          # trip this. Bump to "medium" if you want to gate on those too.
          fail-on: high
          # Emit SARIF so findings show up in the GitHub Security tab.
          sarif: results.sarif

      - name: Upload SARIF to code scanning
        if: always() && steps.slither.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.slither.outputs.sarif }}
